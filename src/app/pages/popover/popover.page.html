<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="Regresar"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-capitalize">popover</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openPopover($event)">
        <ion-icon slot="icon-only" name="archive-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" class="ion-text-center">
         
  <ion-button (click)="openPopover($event)" expand="block" shape="round">
    Click me
  </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
  
</ion-content>
