<app-header title="progress & range"></app-header>

<ion-content [fullscreen]="true">
  <h2 class="ion-text-capitalize ion-padding">progress bar</h2>

  <ion-progress-bar
    type="determinate"
    [value]="progress"
    color="primary"
    class="ion-padding"
  ></ion-progress-bar>

  
  <ion-range
  min="0" 
  max="100"
  value="0"
  color="primary"
  class="ion-padding"
  (ionChange)="rangeChange($event)"
  [(ngModel)]="progress">
  <ion-icon size="small" slot="start" name="sunny-outline"></ion-icon>
  <ion-icon slot="end" name="moon-outline"></ion-icon>
  </ion-range>

  
</ion-content>
